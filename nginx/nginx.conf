user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Rate Limiting Zones (Availability / DoS Protection)
    # 1. Login zone: 5 requests per minute per IP to mitigate brute force credential attacks
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    # 2. General API zone: 60 requests per minute per IP to protect against DoS
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    # Include virtual host configurations
    include /etc/nginx/conf.d/*.conf;
}

