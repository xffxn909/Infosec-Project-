# ==============================================================================
# securedocs.conf — Nginx Reverse Proxy with TLS/HTTPS Termination
# Information Security Semester Project: Secure Document Management System
#
# CIA Controls Implemented:
# - Confidentiality: TLS 1.2/1.3 with custom PKI certificates, Strict-Transport-Security (HSTS)
# - Integrity: Security headers (X-Frame-Options, CSP, X-Content-Type-Options)
# - Availability: Rate limiting against brute force and DoS
# ==============================================================================

# 1. HTTP to HTTPS Redirection (Port 80 -> 443)
server {
    listen 80;
    listen [::]:80;
    server_name localhost securedocs.local 127.0.0.1;

    # Enforce HTTPS redirect
    return 301 https://$host$request_uri;
}

# 2. Secure HTTPS Virtual Host (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name localhost securedocs.local 127.0.0.1;

    # Custom PKI Issued TLS Certificates
    ssl_certificate /etc/ssl/securedocs/server.pem;
    ssl_certificate_key /etc/ssl/securedocs/server_key.pem;

    # Modern TLS Protocols and Cipher Suites (PFS enabled)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

    # Max upload size for documents (e.g., 25MB)
    client_max_body_size 25M;

    # Frontend Static Files (React Single Page App)
    location / {
        root /var/www/securedocs;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API Proxy to Flask Backend with Rate Limiting
    location /api/ {
        # General rate limiting (60 req/min with burst of 20)
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Strict Rate Limiting on Login & Authentication (Anti-Brute Force)
    location /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;

        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

