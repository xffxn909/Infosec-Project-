# ==============================================================================
# render.yaml — 100% Free Tier Deployment Configuration (Zero Cost)
# Render provides free web services and static sites without credit card requirement
# ==============================================================================

services:
  # 1. Flask REST API Backend
  - type: web
    name: securedocs-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && gunicorn --bind 0.0.0.0:$PORT run:app"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: securedocs-db
          property: connectionString
      - key: UPLOAD_FOLDER
        value: uploads

  # 2. React Vite Frontend (Static Site - 100% Free on Render)
  - type: web
    name: securedocs-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: securedocs-backend
          property: host

databases:
  # Managed PostgreSQL (Free Tier on Render)
  - name: securedocs-db
    plan: free
    databaseName: securedocs
    user: postgres
