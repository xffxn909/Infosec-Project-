{% extends "base.html" %}

{% block content %}
<h1>Verification Report</h1>
<div class="card">
  <table>
    {% for k, v in result.items() %}
    <tr>
      <th style="width:200px">{{ k }}</th>
      <td>
        {% if v == True %}<span class="badge badge-green">✅ True</span>
        {% elif v == False %}<span class="badge badge-red">❌ False</span>
        {% else %}{{ v }}{% endif %}
      </td>
    </tr>
    {% endfor %}
  </table>
  <a href="{{ url_for('documents_page') }}" class="btn btn-primary" style="margin-top:16px">← Back to Documents</a>
</div>
{% endblock %}
